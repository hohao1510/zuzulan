<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Pro - Pause Feature</title>
    <style>
        :root { --primary: #2196f3; --bg: #f4f7f6; --cell: #ffffff; --text: #333; --fixed: #e9ecef; --selected: #bbdefb; --error: #f44336; }
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background: var(--bg); margin: 0; padding: 10px; }
        
        .stats-bar { display: flex; justify-content: space-between; width: 100%; max-width: 400px; margin-bottom: 10px; font-weight: bold; color: #555; }
        
        .menu { display: flex; gap: 5px; margin-bottom: 15px; }
        .menu button { padding: 6px 12px; border: 1px solid #ccc; background: white; cursor: pointer; border-radius: 15px; font-size: 13px; }
        .menu button.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Container cho Grid để chứa Overlay */
        #grid-container { position: relative; max-width: 400px; width: 100%; aspect-ratio: 1; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        #grid { display: grid; grid-template-columns: repeat(9, 1fr); border: 3px solid #333; background: #333; gap: 1px; width: 100%; height: 100%; }
        
        /* Màn hình tạm dừng */
        #pause-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(244, 247, 246, 0.97); z-index: 10; 
            display: none; flex-direction: column; align-items: center; justify-content: center; 
        }
        #pause-overlay span { font-size: 24px; font-weight: bold; color: var(--text); margin-bottom: 15px; }

        .cell { background: var(--cell); display: flex; align-items: center; justify-content: center; font-size: clamp(16px, 5vw, 22px); font-weight: bold; cursor: pointer; }
        .cell:nth-child(3n) { border-right: 2px solid #333; }
        .cell:nth-child(9n) { border-right: none; }
        .cell:nth-child(n+19):nth-child(-n+27), .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #333; }
        .cell.fixed { background: var(--fixed); color: #1976d2; }
        .cell.selected { background: var(--selected) !important; }
        .cell.error { color: var(--error); }

        #controls { margin-top: 15px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 400px; }
        #controls button { padding: 12px 0; font-size: 18px; border: none; border-radius: 8px; background: var(--primary); color: white; cursor: pointer; }
        
        .special-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; width: 100%; max-width: 400px; margin-top: 10px; }
        .special-controls button { padding: 10px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .btn-hint { background: #ff9800; }
        .btn-pause { background: #607d8b; } /* Màu xám cho nút tạm dừng */
        .btn-new { background: #4caf50; }

        .history { margin-top: 20px; width: 100%; max-width: 400px; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .history h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .history ul { list-style: none; padding: 0; max-height: 150px; overflow-y: auto; font-size: 13px; }
        .history li { padding: 5px 0; border-bottom: 1px dotted #eee; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <h2>Sudoku Pro</h2>

    <div class="stats-bar">
        <span>Gợi ý: <span id="hint-count">2</span></span>
        <span>Thời gian: <span id="timer">00:00</span></span>
    </div>

    <div class="menu">
        <button id="btn-easy" onclick="changeDifficulty('easy')">Dễ</button>
        <button id="btn-medium" class="active" onclick="changeDifficulty('medium')">Vừa</button>
        <button id="btn-hard" onclick="changeDifficulty('hard')">Khó</button>
    </div>

    <div id="grid-container">
        <div id="pause-overlay">
            <span>TẠM DỪNG</span>
            <button class="menu button active" style="padding: 10px 20px; border-radius: 20px;" onclick="togglePause()">Tiếp tục</button>
        </div>
        <div id="grid"></div>
    </div>

    <div id="controls">
        <button onclick="handleInput(1)">1</button><button onclick="handleInput(2)">2</button>
        <button onclick="handleInput(3)">3</button><button onclick="handleInput(4)">4</button>
        <button onclick="handleInput(5)">5</button><button onclick="handleInput(6)">6</button>
        <button onclick="handleInput(7)">7</button><button onclick="handleInput(8)">8</button>
        <button onclick="handleInput(9)">9</button><button onclick="handleInput(0)" style="background:#f44336">X</button>
    </div>

    <div class="special-controls">
        <button class="btn-hint" onclick="useHint()">Gợi ý</button>
        <button id="btn-pause-main" class="btn-pause" onclick="togglePause()">Tạm dừng</button>
        <button class="btn-new" onclick="startNewGame()">Ván mới</button>
    </div>

    <div class="history">
        <h3>Lịch sử chiến thắng</h3>
        <ul id="history-list"></ul>
    </div>

    <script>
        let solution = [], displayBoard = [], selectedIdx = null, difficulty = 'medium';
        let hintsLeft = 2, seconds = 0, timerInterval = null, isPaused = false;

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${m}:${s}`;
        }

        // HÀM TẠM DỪNG MỚI
        function togglePause() {
            if (displayBoard.length === 0) return; // Không làm gì nếu chưa có game
            
            isPaused = !isPaused;
            const overlay = document.getElementById('pause-overlay');
            const pauseBtn = document.getElementById('btn-pause-main');

            if (isPaused) {
                clearInterval(timerInterval);
                overlay.style.display = 'flex';
                pauseBtn.innerText = "Tiếp tục";
                pauseBtn.style.background = "#2196f3"; // Đổi màu sang xanh khi là nút Tiếp tục
            } else {
                timerInterval = setInterval(() => {
                    seconds++;
                    updateTimerDisplay();
                }, 1000);
                overlay.style.display = 'none';
                pauseBtn.innerText = "Tạm dừng";
                pauseBtn.style.background = "#607d8b";
            }
        }

        function generateSudoku() {
            const base = [1,2,3,4,5,6,7,8,9, 4,5,6,7,8,9,1,2,3, 7,8,9,1,2,3,4,5,6, 2,3,1,5,6,4,8,9,7, 5,6,4,8,9,7,2,3,1, 8,9,7,2,3,1,5,6,4, 3,1,2,6,4,5,9,7,8, 6,4,5,9,7,8,3,1,2, 9,7,8,3,1,2,6,4,5];
            const nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
            solution = base.map(n => nums[n-1]);
            displayBoard = [...solution];
            let hidden = {easy:30, medium:45, hard:55}[difficulty];
            while(hidden > 0) {
                let r = Math.floor(Math.random()*81);
                if(displayBoard[r] !== 0) { displayBoard[r] = 0; hidden--; }
            }
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            displayBoard.forEach((val, i) => {
                const cell = document.createElement('div');
                cell.className = 'cell' + (val !== 0 ? ' fixed' : '') + (selectedIdx === i ? ' selected' : '');
                cell.textContent = val !== 0 ? val : '';
                cell.onclick = () => { 
                    if (isPaused) return; // Không cho chọn ô khi đang tạm dừng
                    selectedIdx = i; 
                    renderGrid(); 
                };
                grid.appendChild(cell);
            });
        }

        function handleInput(num) {
            if (isPaused || selectedIdx === null || document.querySelectorAll('.cell')[selectedIdx].classList.contains('fixed')) return;
            const cell = document.querySelectorAll('.cell')[selectedIdx];
            if (num === 0) { cell.textContent = ""; cell.classList.remove('error'); return; }
            cell.textContent = num;
            if (num !== solution[selectedIdx]) cell.classList.add('error');
            else { cell.classList.remove('error'); displayBoard[selectedIdx] = num; checkWin(); }
        }

        function useHint() {
            if (isPaused || hintsLeft <= 0 || selectedIdx === null || displayBoard[selectedIdx] !== 0) return;
            hintsLeft--;
            document.getElementById('hint-count').textContent = hintsLeft;
            displayBoard[selectedIdx] = solution[selectedIdx];
            renderGrid();
            checkWin();
        }

        function checkWin() {
            if (!displayBoard.includes(0)) {
                clearInterval(timerInterval);
                const timeStr = document.getElementById('timer').textContent;
                saveHistory(difficulty, timeStr);
                alert(`Chúc mừng! Bạn thắng trong ${timeStr}`);
            }
        }

        function saveHistory(diff, time) {
            let history = JSON.parse(localStorage.getItem('sudoku_history') || '[]');
            history.unshift({ diff, time, date: new Date().toLocaleDateString() });
            localStorage.setItem('sudoku_history', JSON.stringify(history.slice(0, 10)));
            loadHistory();
        }

        function loadHistory() {
            const list = document.getElementById('history-list');
            let history = JSON.parse(localStorage.getItem('sudoku_history') || '[]');
            list.innerHTML = history.map(h => `<li><span>${h.date} (${h.diff})</span> <b>${h.time}</b></li>`).join('');
        }

        function changeDifficulty(lvl) {
            difficulty = lvl;
            document.querySelectorAll('.menu button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-'+lvl).classList.add('active');
            startNewGame();
        }

        function startNewGame() {
            isPaused = false;
            document.getElementById('pause-overlay').style.display = 'none';
            document.getElementById('btn-pause-main').innerText = "Tạm dừng";
            document.getElementById('btn-pause-main').style.background = "#607d8b";
            selectedIdx = null; seconds = 0; hintsLeft = 2;
            document.getElementById('hint-count').textContent = hintsLeft;
            document.getElementById('timer').textContent = "00:00";
            generateSudoku(); startTimer();
        }

        window.onload = () => { loadHistory(); startNewGame(); };
    </script>
</body>
</html>
