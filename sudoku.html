<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuzu Sudoku Pro</title>
    <style>
        :root { --primary: #2e7d32; --bg: #f0f2f5; }
        body { font-family: sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        /* Đồng hồ và trạng thái */
        .status-bar { width: 100%; max-width: 400px; display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; color: #333; }
        
        /* Bảng Sudoku */
        #container { position: relative; width: 360px; height: 360px; background: white; border: 2px solid #333; display: grid; grid-template-columns: repeat(9, 1fr); }
        .cell { border: 0.5px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
        .cell:nth-child(3n) { border-right: 2px solid #333; }
        .cell:nth-child(n+19):nth-child(-n+27), .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #333; }
        
        /* Màn che khi Tạm dừng hoặc chưa Bắt đầu */
        #overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.9); display: flex; align-items: center; 
            justify-content: center; z-index: 10; font-weight: bold; color: var(--primary);
        }

        .controls { margin-top: 20px; display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; color: white; cursor: pointer; font-weight: bold; }
        .btn-start { background: var(--primary); }
        .btn-pause { background: #f57c00; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h2 style="color: var(--primary);">Sudoku Zuzu Lan</h2>

    <div class="status-bar">
        <span>Thời gian: <span id="timer">00:00</span></span>
        <span id="game-status">Sẵn sàng</span>
    </div>

    <div id="container">
        <div id="overlay">Nhấn Bắt đầu để chơi</div>
        </div>

    <div class="controls">
        <button id="start-btn" class="btn btn-start" onclick="startGame()">BẮT ĐẦU</button>
        <button id="pause-btn" class="btn btn-pause hidden" onclick="togglePause()">TẠM DỪNG</button>
    </div>

    <script>
        let timerInterval;
        let seconds = 0;
        let isPaused = false;
        let gameStarted = false;

        // Tạo bảng 81 ô
        const container = document.getElementById('container');
        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            // Tạm thời để số giả để minh họa
            if (Math.random() > 0.7) cell.innerText = Math.floor(Math.random() * 9) + 1;
            container.appendChild(cell);
        }

        function startGame() {
            gameStarted = true;
            isPaused = false;
            seconds = 0;
            document.getElementById('overlay').classList.add('hidden');
            document.getElementById('start-btn').innerText = "CHƠI MỚI";
            document.getElementById('pause-btn').classList.remove('hidden');
            document.getElementById('game-status').innerText = "Đang chơi";
            
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
        }

        function togglePause() {
            if (!gameStarted) return;

            isPaused = !isPaused;
            const overlay = document.getElementById('overlay');
            const pauseBtn = document.getElementById('pause-btn');

            if (isPaused) {
                clearInterval(timerInterval);
                overlay.innerText = "ĐÃ TẠM DỪNG";
                overlay.classList.remove('hidden');
                pauseBtn.innerText = "TIẾP TỤC";
                document.getElementById('game-status').innerText = "Tạm dừng";
            } else {
                timerInterval = setInterval(updateTimer, 1000);
                overlay.classList.add('hidden');
                pauseBtn.innerText = "TẠM DỪNG";
                document.getElementById('game-status').innerText = "Đang chơi";
            }
        }

        function updateTimer() {
            seconds++;
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;
        }
    </script>
</body>
</html>
